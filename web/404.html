<style>

  /* SVG */

  .signtext{font:800 25px "Unbounded","Arial Black",sans-serif;fill:var(--wood);text-anchor:middle}
  .insulator{fill:var(--bone);stroke:var(--wood);stroke-width:2}
  .skin{fill:var(--skin)} .shade{fill:var(--skin-shade)} .cheek{fill:var(--cheek);opacity:.45}
  .hide{fill:var(--hide)} .hide-light{fill:none;stroke:var(--hide-light);stroke-width:2;stroke-linecap:round}
  .rope{fill:none;stroke:var(--rope);stroke-width:4;stroke-linecap:round}
  .hair{fill:var(--hair)}
  .brow{fill:none;stroke:var(--hair);stroke-width:4.5;stroke-linecap:round}
  .eye-white{fill:#fff} .iris{fill:var(--iris)} .pupil{fill:#140c06} .glint{fill:#fff}

  .mouth-fill{fill:#3B1A12} .tooth{fill:#fff} .tongue{fill:#C8575A}
  .soot{fill:#1F2B33;opacity:.35}
  .cable,.cable-line{fill:none;stroke:var(--cable);stroke-width:5;stroke-linecap:round}
  .wire{fill:none;stroke:var(--copper);stroke-width:2.2;stroke-linecap:round}
  .cable-cap{fill:var(--cable)}

  .bolt{fill:var(--spark);stroke:#1F2B33;stroke-width:1.5;stroke-linejoin:round}
  .smoke{fill:var(--smoke)}
  .flash{fill:var(--spark);pointer-events:none}

  .bone{fill:var(--bone)} .bone-line{fill:none;stroke:var(--bone);stroke-linecap:round;stroke-linejoin:round}
  .socket{fill:var(--xray)} .socket-line{stroke:var(--xray);stroke-width:1.5}

  #scene.xray .skin, #scene.xray .shade, #scene.xray .hide, #scene.xray .hair, #scene.xray .lid { fill:var(--xray); }
  #scene.xray .rope, #scene.xray .hide-light { stroke:var(--xray); }
  #scene.xray .face, #scene.xray .cheek { visibility:hidden; }
</style>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var svg = $('scene'), rig = $('rig'), torso = $('torso'), headG = $('head'), irises = $('irises');
  var lidL = $('lidL'), lidR = $('lidR');
  var cable = $('cable'), tip = $('tip'), spark = $('spark'), bolts = $('bolts'), flash = $('flash');
  var soot = $('soot'), haloG = $('haloG'), halo = $('halo'), haloHead = $('haloHead'), bonesLimbs = $('bonesLimbs');
  var smoke = $('smoke').querySelectorAll('circle'), boltEls = bolts.querySelectorAll('path');
  var parts = {};
  ['hairN','hairZ','eyes','eZ','eD','mN','mO','mZ','mD','browN','browUp','browSad'].forEach(function (id) { parts[id] = $(id); });
  var el = {};
  ['armL','armR','handL','handR','legL','legR','footL','footR'].forEach(function (id) { el[id] = $(id); });

  var T = 8.5;
  var UPPER = 35, FORE = 32, THIGH = 38, SHIN = 36;
  var START = { x:475, y:322 }, E0 = { x:316, y:316 }, LAND = { x:405, y:318 };
  var OFF = { x:-13, y:-7 };

  // Позы. Точки: abs — в сцене, pel — от таза, mouth — от рта.
  // Точки: abs — в сцене, pel — от таза, sh — от своего плеча, mouth — от рта.
  var idle   = { P:[255,244], lean:0,  head:0,   hL:['sh',-15,63], hR:['sh',15,63],   fL:['abs',236,318], fR:['abs',274,318] };
  var antic  = { P:[254,242], lean:-4, head:-4,  hL:['sh',-17,62], hR:['sh',17,62],   fL:['abs',236,318], fR:['abs',274,318] };
  var reach  = { P:[258,258], lean:50, head:-32, hL:['sh',2,62], hR:['abs',318,306], fL:['abs',230,318], fR:['abs',286,318] };
  var look   = { aR:.6, P:[257,248], lean:8,  head:-4,  hL:['sh',-15,63], hR:['pel',40,-80],  fL:['abs',236,318], fR:['abs',276,318] };
  var bite   = { aR:.4, P:[255,246], lean:-2, head:4,   hL:['sh',-15,63], hR:['mouth',13,7], fL:['abs',236,318], fR:['abs',274,318] };
  var stiff  = { P:[255,236], lean:0,  head:0,   hL:['sh',-42,62], hR:['sh',42,62], fL:['pel',-18,86], fR:['pel',18,86] };
  var yank   = { aR:.4, P:[250,246], lean:-6, head:-6,  hL:['sh',-16,63], hR:['mouth',13,7], fL:['abs',234,318], fR:['abs',272,318] };
  var fling  = { P:[262,246], lean:10, head:6,   hL:['sh',-20,61], hR:['pel',74,-50],  fL:['abs',234,318], fR:['abs',278,318] };
  var dazed  = { P:[255,250], lean:3,  head:8,   hL:['sh',-13,64], hR:['sh',13,64],   fL:['abs',233,318], fR:['abs',277,318] };
  function at(t, p) { var o = { t:t }; for (var k in p) o[k] = p[k]; return o; }
  var K = [at(0,idle), at(1.0,idle), at(1.25,antic), at(1.85,reach), at(2.1,reach), at(2.5,look),
           at(3.05,bite), at(3.35,bite), at(3.5,stiff), at(4.85,stiff), at(5.05,yank), at(5.3,fling),
           at(5.7,dazed), at(7.1,dazed), at(7.9,idle), at(T,idle)];

  function ease(k) { return k * k * k * (k * (k * 6 - 15) + 10); }
  function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function lerpPt(a, b, k) { return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k) }; }
  function rot(p, deg) { var r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return { x: p.x * c - p.y * s, y: p.x * s + p.y * c }; }
  function within(t, a, b) { return t >= a && t < b; }
  function show(e, on) { e.style.display = on ? '' : 'none'; }
  function rnd(n) { var x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }
  function f(n) { return n.toFixed(1); }
  function pt(p) { return f(p.x) + ' ' + f(p.y); }

  function pose(t) {
    var i = 0;
    while (i < K.length - 2 && t > K[i + 1].t) i++;
    var a = K[i], b = K[i + 1];
    var k = b.t === a.t ? 0 : ease(clamp01((t - a.t) / (b.t - a.t)));
    var P = { x: lerp(a.P[0], b.P[0], k), y: lerp(a.P[1], b.P[1], k) };
    var lean = lerp(a.lean, b.lean, k), head = lerp(a.head, b.head, k);
    var calm = t < 1.0 || t >= 7.9;
    var breath = Math.sin(t * 2.6) * (calm || within(t, 5.7, 7.9) ? 1 : 0.3);
    if (calm) { P.x += Math.sin(t * 1.3) * 1.2; head += Math.sin(t * 0.9) * 3; }
    if (within(t, 5.7, 7.1)) { head += Math.sin((t - 5.7) * 4.5) * 7; lean += Math.sin((t - 5.7) * 3) * 3; }
    var toW = function (lp) { var r = rot(lp, lean); return { x: P.x + r.x, y: P.y + r.y }; };
    var hp = rot({ x:0, y:17 }, head);
    var mouth = toW({ x: hp.x, y: -104 - breath * .6 + hp.y });
    var shW = { L: toW({ x:-22, y:-64 }), R: toW({ x:22, y:-64 }) };
    function res(s, side) {
      if (s[0] === 'abs') return { x: s[1], y: s[2] };
      if (s[0] === 'sh') return { x: shW[side].x + s[1], y: shW[side].y + s[2] };
      if (s[0] === 'pel') return { x: P.x + s[1], y: P.y + s[2] };
      return { x: mouth.x + s[1], y: mouth.y + s[2] };
    }
    var bendR = lerp(a.aR || .5, b.aR || .5, k), bendL = lerp(a.aL || .5, b.aL || .5, k);
    var o = { bendR:bendR, bendL:bendL, P:P, lean:lean, head:head, breath:breath, toW:toW, mouth:mouth, headC: toW({ x:0, y:-104 - breath * .6 }) };
    ['hL','hR','fL','fR'].forEach(function (key) { var sd = key.charAt(1); o[key] = lerpPt(res(a[key], sd), res(b[key], sd), k); });
    return o;
  }

  function ik(A, Tg, l1, l2, pref, flat) {
    var dx = Tg.x - A.x, dy = Tg.y - A.y, d = Math.hypot(dx, dy) || 1;
    var ux = dx / d, uy = dy / d;
    var dd = Math.max(Math.abs(l1 - l2) + 1, Math.min(d, l1 + l2 - 0.5));
    var along = (l1 * l1 - l2 * l2 + dd * dd) / (2 * dd);
    var h = Math.sqrt(Math.max(0, l1 * l1 - along * along));
    var nx = -uy, ny = ux;
    if (nx * pref.x + ny * pref.y < 0) { nx = -nx; ny = -ny; }
    h *= (flat || 1);
    return { A: A, J: { x: A.x + ux * along + nx * h, y: A.y + uy * along + ny * h }, E: { x: A.x + ux * dd, y: A.y + uy * dd } };
  }

  // Мягкая «капсула» от точки A (радиус r1) до B (радиус r2)
  function capsule(A, B, r1, r2) {
    var dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 1;
    var nx = -dy / d, ny = dx / d;
    var a1 = { x: A.x + nx * r1, y: A.y + ny * r1 }, a2 = { x: A.x - nx * r1, y: A.y - ny * r1 };
    var b1 = { x: B.x + nx * r2, y: B.y + ny * r2 }, b2 = { x: B.x - nx * r2, y: B.y - ny * r2 };
    return 'M' + pt(a1) + ' L' + pt(b1) + ' A' + f(r2) + ' ' + f(r2) + ' 0 0 0 ' + pt(b2) +
           ' L' + pt(a2) + ' A' + f(r1) + ' ' + f(r1) + ' 0 0 0 ' + pt(a1) + 'Z';
  }
  function limb(c, r1, rJ, r2) {
    // бицепс/бедро чуть толще в середине — добавляем «мышцу»
    var mid = lerpPt(c.A, c.J, .45);
    return capsule(c.A, mid, r1, r1 * 1.08) + capsule(mid, c.J, r1 * 1.08, rJ) + capsule(c.J, c.E, rJ, r2);
  }
  function handShape(c, side) {
    var dx = c.E.x - c.J.x, dy = c.E.y - c.J.y, d = Math.hypot(dx, dy) || 1;
    var ux = dx / d, uy = dy / d, nx = -uy * side, ny = ux * side;
    var palm = { x: c.E.x + ux * 3, y: c.E.y + uy * 3 };
    var thumbA = { x: c.E.x + nx * 4, y: c.E.y + ny * 4 };
    var thumbB = { x: thumbA.x + ux * 4 + nx * 3, y: thumbA.y + uy * 4 + ny * 3 };
    return capsule(c.E, palm, 5.2, 6.2) + capsule(thumbA, thumbB, 2.4, 2.2);
  }
  var tiptoe = 0;
  function footShape(c, side) {
    var heel = { x: c.E.x - side * 2, y: c.E.y + 2 - tiptoe * 3 };
    var toe = { x: c.E.x + side * lerp(11, 6, tiptoe), y: c.E.y + 3 + tiptoe * 8 };
    return capsule(heel, toe, 5, 4.2);
  }

  // Где кабель: лежит → в руке → во рту → в руке → брошен точно на исходное место
  var lastHeld = null;
  function cableEnd(t, hand, mouth) {
    var held = { x: hand.x + OFF.x, y: hand.y + OFF.y };
    if (t < 1.85) return E0;
    if (t < 2.1)  return lerpPt(E0, held, ease((t - 1.85) / .25));
    if (t < 2.8)  return held;
    if (t < 3.0)  return lerpPt(held, mouth, ease((t - 2.8) / .2));   // плавно подводит ко рту
    if (t < 4.85) return mouth;                                        // зажал зубами
    if (t < 5.0)  return lerpPt(mouth, held, ease((t - 4.85) / .15)); // выдёргивает
    if (t < 5.25) { lastHeld = held; return held; }
    if (t < 5.7) {
      var k = (t - 5.25) / .45, R = lastHeld || held;
      var bounce = k > .8 ? Math.sin((k - .8) / .2 * Math.PI) * 5 : 0;
      return { x: lerp(R.x, E0.x, ease(k)), y: lerp(R.y, E0.y, k * k) - 40 * k * (1 - k) - bounce };
    }
    return E0;                                                         // лежит там же, где в начале
  }

  function frame(t) {
    var zap = within(t, 3.4, 4.85);
    var p = pose(t);
    tiptoe = within(t, 3.35, 4.95) ? clamp01(Math.min((t - 3.35) / .15, (4.95 - t) / .15)) : 0;

    var jx = 0, jy = 0;
    if (zap) { jx = (Math.random() - .5) * 6; jy = (Math.random() - .5) * 6; }
    rig.setAttribute('transform', 'translate(' + f(jx) + ' ' + f(jy) + ')');

    var br = p.breath;
    torso.setAttribute('transform', 'translate(' + pt(p.P) + ') rotate(' + f(p.lean) + ') scale(1 ' + (1 + br * 0.012).toFixed(3) + ')');
    var dip = within(t, 3.05, 3.35) ? Math.sin((t - 3.05) / .3 * Math.PI) * 3 : 0;
    headG.setAttribute('transform', 'translate(' + pt(p.P) + ') rotate(' + f(p.lean) + ') translate(0 ' + f(-104 - br * .6 + dip) + ') rotate(' + f(p.head) + ')');

    var shL = p.toW({ x:-22, y:-64 - br }), shR = p.toW({ x:22, y:-64 - br });
    var hipL = p.toW({ x:-12, y:3 }), hipR = p.toW({ x:12, y:3 });
    var aL = ik(shL, p.hL, UPPER, FORE, { x:-0.8, y:1 }, p.bendL);
    var aR = ik(shR, p.hR, UPPER, FORE, { x:0.8, y:1 }, p.bendR);
    var lL = ik(hipL, p.fL, THIGH, SHIN, { x:-1, y:-0.15 }, 0.35);
    var lR = ik(hipR, p.fR, THIGH, SHIN, { x:1, y:-0.15 }, 0.35);

    el.armL.setAttribute('d', limb(aL, 6.8, 5.2, 4.2));
    el.armR.setAttribute('d', limb(aR, 6.8, 5.2, 4.2));
    el.legL.setAttribute('d', limb(lL, 9, 6.6, 4.6));
    el.legR.setAttribute('d', limb(lR, 9, 6.6, 4.6));
    el.handL.setAttribute('d', handShape(aL, 1));
    el.handR.setAttribute('d', handShape(aR, -1));
    el.footL.setAttribute('d', footShape(lL, -1));
    el.footR.setAttribute('d', footShape(lR, 1));

    var bones = '';
    [aL, aR, lL, lR].forEach(function (c) { bones += 'M' + pt(c.A) + ' L' + pt(c.J) + ' L' + pt(c.E); });
    bonesLimbs.setAttribute('d', bones);

    // кабель
    var E = cableEnd(t, aR.E, p.mouth);
    var c2 = { x: E.x + 30, y: Math.min(330, E.y + 70) };
    cable.setAttribute('d', 'M' + START.x + ' ' + START.y + ' C440 332 ' + pt(c2) + ' ' + pt(E));
    var ang = Math.atan2(E.y - c2.y, E.x - c2.x);
    tip.style.display = within(t, 3.0, 4.85) ? 'none' : '';
    tip.setAttribute('transform', 'translate(' + pt(E) + ') rotate(' + f(ang * 180 / Math.PI) + ')');

    // взгляд следит за концом кабеля
    var toCable = rot({ x: E.x - p.headC.x, y: E.y - p.headC.y }, -(p.lean + p.head));
    var gl = Math.hypot(toCable.x, toCable.y) || 1;
    irises.setAttribute('transform', 'translate(' + f(toCable.x / gl * 1.8) + ' ' + f(toCable.y / gl * 1.8) + ')');

    // моргание
    var cyc = (t + 0.4) % 2.9, blink = cyc < 0.14 ? Math.sin(cyc / 0.14 * Math.PI) : 0;
    var lidH = within(t, 5.7, 7.1) ? 7 : blink * 13;
    lidL.setAttribute('height', f(lidH)); lidR.setAttribute('height', f(lidH));

    // искры
    var onGround = t < 1.85 || t >= 5.7;
    var sparkOn = false, scale = .6, r = 0;
    if (zap) { sparkOn = true; scale = 1.1 + Math.random() * .5; r = Math.random() * 90; }
    else if (onGround) sparkOn = within(t, 5.7, 5.95) || (Math.sin(t * 37) + Math.sin(t * 11)) > 1.55;
    show(spark, sparkOn);
    if (sparkOn) spark.setAttribute('transform', 'translate(' + f(E.x + Math.cos(ang) * 8 + jx) + ' ' + f(E.y + Math.sin(ang) * 8 + jy) + ') rotate(' + f(r) + ') scale(' + scale.toFixed(2) + ')');

    // удар током: рентген мигает не чаще 2,5 раза в секунду
    var xray = zap && Math.floor((t - 3.4) / 0.2) % 2 === 0;
    svg.classList.toggle('xray', xray);
    flash.setAttribute('opacity', xray ? '0.15' : '0');
    show(haloG, zap);
    if (zap) {
      haloG.style.opacity = (0.55 + Math.sin(t * 9) * 0.12).toFixed(2);
      halo.setAttribute('d', bones + 'M' + pt(p.P) + ' L' + pt(p.toW({ x:0, y:-70 })));
      haloHead.setAttribute('cx', f(p.headC.x)); haloHead.setAttribute('cy', f(p.headC.y));
      var seed = Math.floor(t * 8);
      for (var i = 0; i < boltEls.length; i++) boltEls[i].style.opacity = rnd(seed * 7 + i) > .35 ? 1 : 0;
    }
    show(bolts, zap);

    // мимика
    var dz = within(t, 5.3, 7.3), open = within(t, 2.72, 3.08), worried = within(t, 2.3, 3.35);
    show(parts.hairN, !within(t, 3.4, 7.3));
    show(parts.hairZ, within(t, 3.4, 7.3));
    show(parts.eZ, zap);
    show(parts.eD, dz && !zap);
    show(parts.eyes, !zap && !dz);
    show(parts.mO, open);
    show(parts.mZ, zap);
    show(parts.mD, dz && !zap);
    show(parts.mN, !open && !zap && !dz);
    show(parts.browUp, zap || within(t, 4.85, 5.3));
    show(parts.browSad, dz && !within(t, 4.85, 5.3));
    show(parts.browN, !zap && !dz && !within(t, 4.85, 5.3));
    if (worried && !open) show(parts.browN, true);
    var so = 0;
    if (within(t, 3.5, 7.3)) so = 1; else if (within(t, 7.3, 7.8)) so = 1 - (t - 7.3) / .5;
    soot.style.opacity = so;

    // дымок
    for (var j = 0; j < smoke.length; j++) {
      var q = (t - 5.2 - j * .35) / 1.7, c = smoke[j];
      if (q > 0 && q < 1) {
        c.setAttribute('cx', f(p.headC.x - 14 + j * 14));
        c.setAttribute('cy', f(p.headC.y - 40));
        c.setAttribute('r', f(5 + q * 9));
        c.setAttribute('transform', 'translate(' + f(Math.sin(q * 6 + j) * 5) + ' ' + f(-q * 50) + ')');
        c.style.opacity = (1 - q) * .85;
      } else c.setAttribute('r', '0');
    }
  }

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { frame(0.5); return; }
  var start = null;
  function loop(now) {
    if (start === null) start = now;
    frame(((now - start) / 1000) % T);
    requestAnimationFrame(loop);
  }
  frame(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
