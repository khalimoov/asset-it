<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — страница не найдена</title>
<link rel="icon" href="/static/favicon/favicon.ico" sizes="any">
<link rel="icon" href="/static/favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
<link rel="manifest" href="/static/favicon/site.webmanifest">
<!-- Шрифты с Google не держат показ страницы: на сервере без интернета она сразу
     открывается системными шрифтами, а не ждёт, пока запрос отвалится. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --bg-top:#E3EEF0; --bg-bottom:#F4ECDD; --ink:#1F2B33; --muted:#4A5963; --accent:#F2B84B;
    --paper:#FFF9EC; --paper-line:#C9B98F; --wing:#FFFFFF;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top:#0F1A21; --bg-bottom:#1D2B34; --ink:#E6EEF1; --muted:#A8B7BE;
      --paper:#F4EEDD; --wing:#E8EEF0;
    }
  }
  :root[data-theme="dark"] {
    --bg-top:#0F1A21; --bg-bottom:#1D2B34; --ink:#E6EEF1; --muted:#A8B7BE;
    --paper:#F4EEDD; --wing:#E8EEF0;
  }
  :root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  *, *::before, *::after { box-sizing:inherit; }
  html, body { height:100%; margin:0; }
  body {
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:var(--bg-bottom); background-image:linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color:var(--ink); font-family:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  main { width:min(640px,100%); padding:4.5rem 1.25rem 2.5rem; text-align:center; position:relative; z-index:1; }
  .digits {
    font-family:"Unbounded","Arial Black","Segoe UI",sans-serif; font-weight:800;
    font-size:clamp(5rem, 22vw, 9.5rem); line-height:1; letter-spacing:.02em;
    display:flex; justify-content:center; gap:.08em; user-select:none;
  }
  h1 { font-family:"Unbounded","Arial Black","Segoe UI",sans-serif; font-weight:800; font-size:clamp(1.5rem,4.8vw,2.3rem); line-height:1.15; margin:.6em 0 .35em; }
  p { max-width:40ch; margin:0 auto; font-size:1.1rem; line-height:1.55; color:var(--muted); }
  .actions { display:flex; flex-wrap:wrap; gap:.75rem; justify-content:center; margin-top:1.6rem; }
  .btn { font:700 1rem/1 "Nunito","Segoe UI",system-ui,sans-serif; padding:.95em 1.5em; border-radius:14px; text-decoration:none; cursor:pointer; border:2px solid var(--ink); transition:transform .15s ease; }
  .btn:hover { transform:translateY(-2px); }
  .btn:focus-visible, .icon-btn:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  .btn-primary { background:var(--ink); color:var(--bg-bottom); }
  .btn-secondary { background:transparent; color:var(--ink); }
  .score { min-height:1.5em; margin-top:1rem; font-weight:700; color:var(--ink); opacity:0; transition:opacity .3s; }
  .score.on { opacity:1; }

  .topbar { position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); left:12px; right:12px; display:flex; justify-content:space-between; gap:8px; z-index:3; }
  .icon-btn { width:44px; height:44px; border-radius:12px; border:2px solid var(--ink); background:transparent; color:var(--ink); display:grid; place-items:center; cursor:pointer; padding:0; flex:none; }
  .icon-btn svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  #stage { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; overflow:visible; }
  .eye-w { fill:#fff; stroke:#2A333A; stroke-width:1; } .eye-p { fill:#141A1F; }
  .mouth { fill:#3B1A12; }
  .paper { fill:var(--paper); stroke:#2A333A; stroke-width:1.6; stroke-linejoin:round; }
  .paper-line { fill:none; stroke:var(--paper-line); stroke-width:1.4; stroke-linecap:round; }
  .wing { fill:var(--wing); stroke:#2A333A; stroke-width:1.4; stroke-linejoin:round; }
  .stamp { fill:#E46B4F; } .stamp-t { font:800 4.2px "Unbounded",sans-serif; fill:#fff; text-anchor:middle; }
</style>
</head>
<body>
<div class="topbar" style="justify-content:flex-end">
  <button class="icon-btn" id="themeBtn" type="button" aria-label="Переключить тему"></button>
</div>

<main>
  <div class="digits" aria-hidden="true"><span>4</span><span id="zero">0</span><span>4</span></div>
  <h1>Страница не найдена</h1>
  <p id="lead"></p>
  <div class="actions">
    <a class="btn btn-primary" href="/">На главную</a>
    <button class="btn btn-secondary" type="button" onclick="history.length > 1 ? history.back() : (location.href='/')">Вернуться назад</button>
  </div>
  <p id="score" class="score" role="status" aria-live="polite"></p>
</main>

<svg id="stage" aria-hidden="true">
  <g id="bits"></g>
  <g id="gMail"></g>
</svg>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';
  function mk(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  function f(n) { return n.toFixed(1); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function clamp01(v) { return clamp(v, 0, 1); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function angDiff(a, b) { var d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- общее ----------
  var mouse = null, caught = 0;
  function track(e) { mouse = { x: e.clientX, y: e.clientY, t: performance.now() / 1000 }; }
  window.addEventListener('pointermove', track);
  window.addEventListener('pointerdown', track);
  document.addEventListener('pointerleave', function () { mouse = null; });
  function home() { var r = $('zero').getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top - 10 }; }
  function scale() { return window.innerWidth < 520 ? 1 : 1.25; }

  var bitsG = $('bits'), scoreEl = $('score');
  function burst(x, y, color, square) {
    for (var i = 0; i < 8; i++) {
      var e = square ? mk('rect', { width: 4, height: 4, x: -2, y: -2, fill: color }, bitsG) : mk('circle', { r: 2, fill: color }, bitsG);
      var a = Math.random() * Math.PI * 2, v = 50 + Math.random() * 70;
      e._d = { x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 50, life: 0, rot: Math.random() * 360 };
    }
  }
  function updateBits(dt) {
    Array.prototype.slice.call(bitsG.childNodes).forEach(function (e) {
      var d = e._d; d.life += dt; d.vy += 240 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += 400 * dt;
      e.setAttribute('transform', 'translate(' + f(d.x) + ' ' + f(d.y) + ') rotate(' + f(d.rot) + ')');
      e.style.opacity = clamp01(1 - d.life / .9).toFixed(2);
      if (d.life > .9) bitsG.removeChild(e);
    });
  }
  function plural(n) { var a = n % 10, b = n % 100; return (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? 'раза' : 'раз'; }
  function scored() {
    caught++;
    scoreEl.textContent = 'Вас поймали ' + caught + ' ' + plural(caught) + '.';
    scoreEl.classList.add('on');
  }

  // =====================================================================
  // Потерянный конверт с бумажными крылышками
  // =====================================================================
  var Mail = (function () {
    var g = $('gMail'), root, flapEl, mouthEl, wingL, wingR, pupils = [];
    var pos, vx = 0, vy = 0, tilt = 0, chomp = -1, cooldown = 0, openS = 0;
    function init() {
      g.innerHTML = ''; pupils = [];
      root = mk('g', {}, g);
      wingL = mk('path', { class: 'wing' }, root);
      wingR = mk('path', { class: 'wing' }, root);
      mouthEl = mk('path', { class: 'mouth', d: 'M-22 -14 L22 -14 L0 3Z' }, root);
      mk('rect', { class: 'paper', x: -22, y: -14, width: 44, height: 28, rx: 3 }, root);
      mk('path', { class: 'paper-line', d: 'M-21 13 L-4 1 M21 13 L4 1' }, root);
      mk('rect', { class: 'stamp', x: 11, y: 3, width: 8, height: 8, rx: 1 }, root);
      mk('text', { class: 'stamp-t', x: 15, y: 8.6 }, root).textContent = '404';
      [-7, 7].forEach(function (ex) {
        mk('circle', { class: 'eye-w', cx: ex, cy: 3, r: 4 }, root);
        pupils.push(mk('circle', { class: 'eye-p', cx: ex, cy: 3, r: 1.9 }, root));
      });
      flapEl = mk('path', { class: 'paper' }, root);
      var H = home(); pos = { x: H.x, y: H.y - 6 }; vx = vy = 0;
    }
    function update(dt, now, hunting) {
      var H = home(), sc = scale();
      var tx = hunting ? mouse.x : H.x, ty = hunting ? mouse.y : H.y - 6 * sc;
      // летит мягко, как на пружинке
      var k = hunting ? 7 : 5, damp = 4.2;
      vx += ((tx - pos.x) * k - vx * damp) * dt; vy += ((ty - pos.y) * k - vy * damp) * dt;
      var sp = Math.hypot(vx, vy); if (sp > 320) { vx *= 320 / sp; vy *= 320 / sp; sp = 320; }
      pos.x = clamp(pos.x + vx * dt, 30, innerWidth - 30); pos.y = clamp(pos.y + vy * dt, 30, innerHeight - 30);
      var d = Math.hypot(tx - pos.x, ty - pos.y);
      var resting = !hunting && d < 6 && sp < 15;
      var flying = !resting;
      tilt = lerp(tilt, clamp(vx * .07, -22, 22), Math.min(1, dt * 6));
      var bob = flying ? Math.sin(now * 6) * 3 : 0;
      // крылышки машут в полёте и складываются, когда сидит
      var flap = flying ? Math.sin(now * (hunting ? 20 : 12)) : -1;
      var wy = -10 - flap * 12, wy2 = -2 - flap * 6;
      wingL.setAttribute('d', 'M-20 -4 L' + f(-40) + ' ' + f(wy) + ' L' + f(-32) + ' ' + f(wy2 + 6) + ' Z');
      wingR.setAttribute('d', 'M20 -4 L40 ' + f(wy) + ' L32 ' + f(wy2 + 6) + ' Z');
      wingL.style.display = wingR.style.display = resting ? 'none' : '';
      cooldown -= dt;
      if (hunting && cooldown <= 0 && d < 18 * sc) {
        cooldown = 1; chomp = 0; scored(); burst(mouse.x, mouse.y, 'var(--paper)', true);
        vy -= 120;
      }
      // клапан — это рот: открывается, когда курсор близко
      var target = hunting ? clamp01(1.2 - d / 130) : 0;
      if (chomp >= 0) { chomp += dt; target = chomp < .12 ? 1 : 0; if (chomp > .6) chomp = -1; }
      openS = lerp(openS, target, Math.min(1, dt * (chomp >= 0 ? 30 : 8)));
      var tipY = lerp(3, -34, openS);
      flapEl.setAttribute('d', 'M-22 -14 L22 -14 L0 ' + f(tipY) + 'Z');
      mouthEl.style.opacity = openS > .15 ? 1 : 0;
      var look = mouse || { x: pos.x, y: pos.y + 100 }, la = Math.atan2(look.y - pos.y, look.x - pos.x);
      pupils.forEach(function (p, i) { p.setAttribute('cx', f((i ? 7 : -7) + Math.cos(la) * 1.6)); p.setAttribute('cy', f(3 + Math.sin(la) * 1.6)); });
      var shake = chomp >= 0 ? Math.sin(chomp * 50) * 5 : 0;
      root.setAttribute('transform', 'translate(' + f(pos.x) + ' ' + f(pos.y + bob) + ') rotate(' + f(tilt + shake) + ') scale(' + sc + ')');
    }
    return { g: g, init: init, update: update,
             lead: 'Эта страница потерялась, как письмо без адреса. Зато конверт нашёлся, и он очень хочет с вами познакомиться. Проверьте адрес или вернитесь на главную.' };
  })();

  // ---------- запуск ----------
  var current = Mail;
  current.init();
  $('lead').textContent = current.lead;
  var lastT = null;
  function tick(ms) {
    var now = ms / 1000, dt = lastT === null ? 0 : Math.min(.05, now - lastT); lastT = now;
    current.update(dt, now, !!(mouse && now - mouse.t < 3));
    updateBits(dt);
    requestAnimationFrame(tick);
  }
  if (reduce) current.update(0, 0, false); else requestAnimationFrame(tick);

  // ---------- тема ----------
  var root = document.documentElement, themeBtn = $('themeBtn');
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  var ICON_SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function isDark() { var d = root.getAttribute('data-theme'); return d ? d === 'dark' : !!(mq && mq.matches); }
  function paint() { themeBtn.innerHTML = isDark() ? ICON_SUN : ICON_MOON; themeBtn.setAttribute('aria-label', isDark() ? 'Включить светлую тему' : 'Включить тёмную тему'); }
  try { var saved = localStorage.getItem('theme404'); if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved); } catch (e) {}
  themeBtn.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark'; root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme404', next); } catch (e) {}
    paint();
  });
  if (mq && mq.addEventListener) mq.addEventListener('change', paint);
  paint();
})();
</script>
</body>
</html>
