<!-- Окна: dlgStaffInfo, dlgStaff -->
<dialog id="dlgStaffInfo" class="xwide">
  <div class="dlg-head" id="siTitle">Пользователь ИТ</div>
  <div class="dlg-body">
    <div class="kv">
      <div><span>Должность</span><b id="si_pos">—</b></div>
      <div><span>Роль</span><b id="si_role">—</b></div>
      <div><span>Мастер по ремонту</span><b id="si_master">—</b></div>
      <div><span>Логин</span><b id="si_login">—</b></div>
    </div>
    <div class="sec"><b>Сейчас на ремонте</b><div id="si_repair"></div></div>
    <div class="sec">
      <b>История ремонтов</b>
      <div class="note" id="si_stat" style="margin:6px 0 0"></div>
      <div id="si_history"></div>
    </div>
  </div>
  <div class="dlg-foot">
    <button id="btnSiEdit">Изменить данные</button>
    <button id="btnSiClose" class="btn-primary">Закрыть</button>
  </div>
</dialog>

<dialog id="dlgStaff">
  <div class="dlg-head" id="dlgStaffTitle">Пользователь ИТ</div>
  <div class="dlg-body">
    <div class="grid2">
      <div class="field"><label for="st_name">ФИО</label><input id="st_name" placeholder="Халимов Б.Ш."></div>
      <div class="field"><label for="st_pos">Должность</label><input id="st_pos" placeholder="Инженер"></div>
      <div class="field"><label for="st_login">Логин</label><input id="st_login" placeholder="i.ivanov"></div>
      <div class="field"><label for="st_auth">Откуда пароль</label>
        <select id="st_auth">
          <option value="local">Свой пароль (задаёт администратор)</option>
          <option value="ad">Active Directory — доменный пароль</option>
        </select></div>
      <div class="field"><label for="st_org">Учреждение</label><select id="st_org"></select></div>
      <div class="field"><label for="st_role">Роль</label><select id="st_role"></select></div>
    </div>
    <div class="grid2" style="margin-top:12px">
      <div class="field"><label for="st_pass">Пароль</label>
        <input id="st_pass" type="password" autocomplete="new-password"
               placeholder="оставьте пустым, чтобы не менять"></div>
      <div class="field"><label>&nbsp;</label>
        <label class="chk"><input type="checkbox" id="st_master"> Мастер по ремонту</label>
        <label class="chk"><input type="checkbox" id="st_active" checked> Доступ разрешён</label>
        <label class="chk"><input type="checkbox" id="st_edit"> Разрешено редактирование</label>
      </div>
    </div>
  </div>
  <div class="dlg-foot">
    <button id="btnStaffDel" class="btn-danger" hidden>Удалить</button>
    <button id="btnStaffCancel">Отмена</button>
    <button id="btnStaffSave" class="btn-primary">Сохранить</button>
  </div>
</dialog>
