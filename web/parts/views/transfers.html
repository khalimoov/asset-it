      </div>
      <div class="card">

              <col class="hide-md" style="width:11%"><col style="width:13%"><col style="width:10.6%"></colgroup>
            <thead><tr><th class="num">#</th><th>Когда</th><th>Инв. номер</th><th>Тип</th>
              <th>Откуда</th><th>Куда</th><th class="hide-md">Кто</th><th>Примечание</th><th>Файл</th></tr></thead>
            <tbody id="xferBody"></tbody>
          </table>
        </div>
        <div class="empty" id="xferEmpty" hidden>Накладных по передаче пока нет.</div>
      </div>
