<!-- Раздел v-users -->
    <section id="v-users" hidden>
      <div class="searchbar">
        <div class="searchbox"><input id="qUser" type="search" placeholder="Поиск по ФИО, должности, подразделению…"></div>
        <div class="row">
          <button id="btnCollectUsers">Собрать из записей</button>
          <button class="btn-primary" id="btnAddUser">+ Сотрудник</button>
        </div>
      </div>
      <div class="card">
        <div class="tablewrap">
          <table>
            <colgroup><col style="width:3.4%"><col style="width:20%"><col style="width:14%"><col style="width:13%"><col class="hide-md" style="width:11%"><col class="hide-md" style="width:9%"><col class="hide-md" style="width:13%"><col style="width:8%"><col style="width:8%"></colgroup>
            <thead><tr><th class="num">#</th><th>ФИО</th><th>Должность</th><th>Подразделение</th><th class="hide-md">Отдел</th><th class="hide-md">Телефон</th><th class="hide-md">Почта</th><th>Позиций</th><th></th></tr></thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
        <div class="empty" id="usersEmpty" hidden>Сотрудники пока не заведены.</div>
      </div>
    </section>
